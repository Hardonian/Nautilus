name: Nautilus MVP package

on:
  pull_request:
    paths:
      - "package.json"
      - "scripts/nautilus/**"
      - "examples/nautilus/**"
      - "test/fixtures/nautilus/**"
      - "docs/nautilus/**"
      - ".github/workflows/nautilus-package.yml"
  push:
    branches:
      - main

jobs:
  package:
    name: install, verify, and smoke Nautilus package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build:cli
      - name: Nautilus golden-path smoke
        run: npm run nautilus:golden-path
      - name: Nautilus replay smoke
        run: npm run nautilus:replay-smoke
      - name: Nautilus proofpack smoke
        run: npm run nautilus:proofpack-smoke
      - name: Nautilus runtime-health smoke
        run: npm run nautilus:runtime-health-smoke
      - name: Nautilus examples smoke
        run: npm run nautilus:examples
      - name: Nautilus verify
        run: npm run nautilus:verify
      - name: Repo doctor
        run: npm run doctor
      - name: Verification summary
        run: npm run verification:summary
      - name: Build release artifacts
        run: npm run release:artifacts
      - name: Assemble release package
        run: npm run release:assemble
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nautilus-release-artifacts
          path: |
            artifacts/release-manifest.json
            artifacts/verification-summary.json
            artifacts/proofpack/**
            artifacts/smoke-output/**
            artifacts/release-bundle/**
            artifacts/*.zip
